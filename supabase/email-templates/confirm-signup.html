<h2>Confirm your email</h2>

<p>Click the link below to confirm your email address and open your ProspectIQ account.</p>

<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/dashboard">Confirm my email</a></p>

<p>This link works once and expires after an hour. If you did not sign up, you can ignore this email.</p>

<p>AI Wealth Partners</p>
