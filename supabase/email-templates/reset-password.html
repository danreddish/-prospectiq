<!--
  Supabase > Authentication > Emails > Reset Password
  Subject: Reset your ProspectIQ password
  Paste everything below this comment into the Message body (Source view).

  Routes through /auth/confirm (token hash flow), so the link works even
  when it is opened on a different device from the one that asked for it.
-->
<h2>Reset your password</h2>

<p>Click the link below to choose a new password for your ProspectIQ account.</p>

<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/auth/reset-password">Choose a new password</a></p>

<p>This link works once and expires after an hour. If you did not ask for this, you can ignore this email and your password will stay the same.</p>

<p>AI Wealth Partners</p>
